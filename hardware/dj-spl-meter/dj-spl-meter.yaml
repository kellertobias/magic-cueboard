esphome:
  name: "dj-spl-meter"
  friendly_name: "DJ SPL Meter"
  #name_add_mac_suffix: true
  project:
    name: "Guition.ESP32_S3_4848S040"
    version: "1.0.1"
  platformio_options:
    board_build.flash_mode: dio

# Enable Home Assistant API
api:
  reboot_timeout: 0s

# Enable web logging
logger:
  level: DEBUG
  logs:
    esphome: DEBUG
    component: DEBUG
    wifi: DEBUG
    lvgl: DEBUG
    display: DEBUG

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# Example configuration entry
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# MQTT Client Configuration
mqtt:
  broker: !secret mqtt_broker
  client_id: dj-spl-meter
  discovery: false # Disable Home Assistant MQTT discovery
  on_connect:
    then:
      - logger.log: "MQTT Connected"
  on_disconnect:
    then:
      - logger.log: "MQTT Disconnected"

  # The Qboard owns SPL calculation and thresholds. Its topics are retained.
  on_message:
    - topic: "spl/value"
      then:
        - lvgl.label.update:
            id: current_spl_label
            text: !lambda |-
              static char buf[32];
              snprintf(buf, 32, "%.1f dBA", atof(x.c_str()));
              return buf;

    - topic: "tosklight/spl/level"
      then:
        - sensor.template.publish:
            id: spl_average
            state: !lambda return atof(x.c_str());

    - topic: "tosklight/spl/peak"
      then:
        - sensor.template.publish:
            id: spl_peak
            state: !lambda return atof(x.c_str());
        - lvgl.bar.update:
            id: spl_bar
            value: !lambda return min(max((float) atof(x.c_str()), 50.0f), 110.0f);

    - topic: "tosklight/spl/color"
      then:
        - lambda: |-
            id(spl_color) = x;
            if (id(spl_color).length() >= 2 && id(spl_color)[0] == '"')
              id(spl_color) = id(spl_color).substr(1, id(spl_color).length() - 2);
        - script.execute: apply_spl_color

    - topic: "tosklight/dj/display-inbox"
      then:
        - lambda: |-
            id(dj_incoming_message) = x.substr(0, 500);
            id(dj_message_pending) = true;
            id(spl_blink_on) = true;
        - lvgl.label.update:
            id: incoming_message_label
            text: !lambda return id(dj_incoming_message).c_str();
        - lvgl.page.show: main_page
        - lvgl.widget.hide: time_label
        - lvgl.widget.show: incoming_message_banner
        - lvgl.label.update:
            id: incoming_message_banner
            text: !lambda return id(dj_incoming_message).c_str();
        - script.execute: apply_spl_color

    - topic: "tosklight/dj/message-topic"
      then:
        - lambda: |-
            id(dj_message_topic) = x;
    - topic: "tosklight/dj/preset/1"
      then:
        - lambda: |-
            id(dj_message_1) = x;
        - lvgl.label.update:
            id: message_label_1
            text: !lambda |-
              return id(dj_message_1).empty() ? "—" : id(dj_message_1).c_str();
    - topic: "tosklight/dj/preset/2"
      then:
        - lambda: |-
            id(dj_message_2) = x;
        - lvgl.label.update:
            id: message_label_2
            text: !lambda |-
              return id(dj_message_2).empty() ? "—" : id(dj_message_2).c_str();
    - topic: "tosklight/dj/preset/3"
      then:
        - lambda: |-
            id(dj_message_3) = x;
        - lvgl.label.update:
            id: message_label_3
            text: !lambda |-
              return id(dj_message_3).empty() ? "—" : id(dj_message_3).c_str();
    - topic: "tosklight/dj/preset/4"
      then:
        - lambda: |-
            id(dj_message_4) = x;
        - lvgl.label.update:
            id: message_label_4
            text: !lambda |-
              return id(dj_message_4).empty() ? "—" : id(dj_message_4).c_str();
    - topic: "tosklight/dj/preset/5"
      then:
        - lambda: |-
            id(dj_message_5) = x;
        - lvgl.label.update:
            id: message_label_5
            text: !lambda |-
              return id(dj_message_5).empty() ? "—" : id(dj_message_5).c_str();
    - topic: "tosklight/dj/preset/6"
      then:
        - lambda: |-
            id(dj_message_6) = x;
        - lvgl.label.update:
            id: message_label_6
            text: !lambda |-
              return id(dj_message_6).empty() ? "—" : id(dj_message_6).c_str();

    - topic: "time"
      then:
        - lvgl.label.update:
            id: time_label
            text: !lambda if(x.length() > 0) {
              if(x[0] == '"' && x[x.length()-1] == '"') {
              return x.substr(1, x.length()-2).c_str();
              } else {
              return x.c_str();
              }
              } else {
              return "--:--:--";
              }

web_server:
  port: 80

captive_portal:

globals:
  - id: spl_color
    type: std::string
    initial_value: '"blue"'
  - id: spl_blink_on
    type: bool
    initial_value: 'true'
  - id: dj_message_pending
    type: bool
    initial_value: 'false'
  - id: dj_incoming_message
    type: std::string
    initial_value: '""'
  - id: dj_message_topic
    type: std::string
    initial_value: '"tosklight/dj/message"'
  - id: dj_message_1
    type: std::string
    initial_value: '"Audio problem"'
  - id: dj_message_2
    type: std::string
    initial_value: '"Light problem"'
  - id: dj_message_3
    type: std::string
    initial_value: '"Yes"'
  - id: dj_message_4
    type: std::string
    initial_value: '"No"'
  - id: dj_message_5
    type: std::string
    initial_value: '""'
  - id: dj_message_6
    type: std::string
    initial_value: '""'

interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: return id(spl_color) == "red-blink" || id(dj_message_pending);
          then:
            - lambda: id(spl_blink_on) = !id(spl_blink_on);
            - script.execute: apply_spl_color

script:
  - id: apply_spl_color
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(spl_color) == "red" || (id(spl_color) == "red-blink" && id(spl_blink_on));
          then:
            - lvgl.update:
                disp_bg_color: 0x990000
            - lvgl.label.update:
                id: spl_value_label
                text_color: 0xFFFFFF
            - lvgl.label.update:
                id: peak_spl_label
                text_color: 0xFFFFFF
            - lvgl.label.update:
                id: current_spl_label
                text_color: 0xFFFFFF
            - lvgl.label.update:
                id: status_label
                text: "Volume Critical"
          else:
            - if:
                condition:
                  lambda: return id(spl_color) == "red-blink";
                then:
                  - lvgl.update:
                      disp_bg_color: 0x110000
                  - lvgl.label.update:
                      id: spl_value_label
                      text_color: 0xFFFFFF
                  - lvgl.label.update:
                      id: peak_spl_label
                      text_color: 0xFFFFFF
                  - lvgl.label.update:
                      id: current_spl_label
                      text_color: 0xFFFFFF
                else:
                  - if:
                      condition:
                        lambda: return id(spl_color) == "yellow";
                      then:
                        - lvgl.update:
                            disp_bg_color: 0x554400
                        - lvgl.label.update:
                            id: spl_value_label
                            text_color: 0xFFFFFF
                        - lvgl.label.update:
                            id: peak_spl_label
                            text_color: 0xFFFFFF
                        - lvgl.label.update:
                            id: current_spl_label
                            text_color: 0xFFFFFF
                        - lvgl.label.update:
                            id: status_label
                            text: "Volume High"
                      else:
                        - if:
                            condition:
                              lambda: return id(spl_color) == "green";
                            then:
                              - lvgl.update:
                                  disp_bg_color: 0x004400
                              - lvgl.label.update:
                                  id: spl_value_label
                                  text_color: 0xFFFFFF
                              - lvgl.label.update:
                                  id: peak_spl_label
                                  text_color: 0xFFFFFF
                              - lvgl.label.update:
                                  id: current_spl_label
                                  text_color: 0xFFFFFF
                              - lvgl.label.update:
                                  id: status_label
                                  text: "Volume OK"
                            else:
                              - lvgl.update:
                                  disp_bg_color: 0x000044
                              - lvgl.label.update:
                                  id: spl_value_label
                                  text_color: 0xFFFFFF
                              - lvgl.label.update:
                                  id: peak_spl_label
                                  text_color: 0xFFFFFF
                              - lvgl.label.update:
                                  id: current_spl_label
                                  text_color: 0xFFFFFF
                              - lvgl.label.update:
                                  id: status_label
                                  text: "Volume Too Low"
      - if:
          condition:
            lambda: return id(dj_message_pending) && !id(spl_blink_on);
          then:
            - lvgl.widget.hide: envelope_label
          else:
            - lvgl.widget.show: envelope_label
  - id: dismiss_message
    then:
      - lambda: id(dj_message_pending) = false;
      - lvgl.widget.hide: incoming_message_banner
      - lvgl.widget.show: time_label
      - lvgl.widget.show: envelope_label
      - lvgl.page.show: main_page
      - script.execute: apply_spl_color

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 15s
    entity_category: diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""
    on_value:
      - lvgl.label.update:
          id: wifi_label
          text: !lambda |-
            static char buf[32];
            snprintf(buf, 32, "WiFi: %.0fdBm ", id(wifi_signal_db).get_state());
            return buf;

  - platform: template
    name: "SPL Peak"
    id: spl_peak
    unit_of_measurement: "dB"
    on_value:
      - lvgl.label.update:
          id: peak_spl_label
          text: !lambda |-
            static char buf[24];
            snprintf(buf, 24, "%.1f dB Peak", x);
            return buf;

  - platform: template
    name: "SPL Average"
    id: spl_average
    unit_of_measurement: "dB"
    on_value:
      - lvgl.label.update:
          id: spl_value_label
          text: !lambda |-
            static char buf[10];
            snprintf(buf, 10, "%.1f", x);
            return buf;

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      name: "Mac Address"
      entity_category: diagnostic

#-------------------------------------------
#-------------------------------------------
lvgl:
  id: lvgl_comp
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: my_touchscreen

  page_wrap: true
  bg_color: 0x111111
  top_layer:
    widgets:
      - button:
          id: message_menu_button
          align: TOP_LEFT
          x: 8
          y: 8
          width: 52
          height: 52
          bg_color: 0x203050
          on_click:
            - if:
                condition:
                  lambda: return id(dj_message_pending);
                then:
                  - lvgl.widget.hide: incoming_message_banner
                  - lvgl.widget.show: time_label
                  - lvgl.page.show: incoming_message_page
                else:
                  - lvgl.page.show: message_page
          widgets:
            - label:
                id: envelope_label
                text: "✉"
                align: CENTER
                text_font: envelope_font
                text_color: 0xFFFFFF
      - label:
          id: incoming_message_banner
          hidden: true
          align: TOP_MID
          x: 28
          y: 34
          width: 350
          height: 55
          long_mode: SCROLL_CIRCULAR
          text: ""
          text_font: roboto24
          text_align: CENTER
          text_color: 0xFFFFFF
  pages:
    - id: main_page
      skip: false
      layout:
        type: flex
        flex_flow: column_wrap
      width: 480
      height: 480
      bg_color: 0x000000
      bg_opa: 0%
      pad_all: 0
      widgets:
        - label:
            id: wifi_label
            text: "WiFi: ..."
            width: 480
            height: 30
            pad_right: 10
            pad_top: 10
            text_align: right
            text_font: roboto16
            text_color: 0xFFFFFF
            text_opa: 100%
        - label:
            width: 480
            height: 5
            text: " "
        - label:
            id: time_label
            text: "--:--:--"
            y: 80
            width: 480
            height: 40
            text_font: roboto48
            text_align: center
            text_color: 0xFFFFFF
        - label:
            width: 480
            height: 10
            text: " "
        - obj:
            align: CENTER
            width: 480
            height: 30
            scrollable: false
            bg_opa: TRANSP
            border_opa: TRANSP
            layout: # enable the FLEX layout for the children widgets
              type: FLEX
              flex_flow: ROW # the order of the widgets starts top left
              flex_align_cross: CENTER # they sould be centered
            widgets:
              - label:
                  width: 80
                  height: 10
                  text: " "
              - bar:
                  id: spl_bar
                  animated: false
                  width: 300
                  height: 10
                  indicator:
                    bg_color: 0xFFFFFF
                  value: 50
                  min_value: 50
                  max_value: 110
                  bg_color: 0x333333
                  arc_width: 4
                  pad_all: 3
              - label:
                  width: 80
                  height: 10
                  text: " "
        - label:
            id: spl_value_label
            text: "0.0"
            width: 480
            height: 160
            y: 140
            x: 0
            text_align: center
            text_font: font_large
            text_color: 0xFFFFFF
        - label:
            id: spl_unit_label
            text: "dBA Average"
            width: 480
            y: 300
            x: 0
            text_font: roboto24
            text_align: center
            text_color: 0xFFFFFF
            text_opa: 100%
        - label:
            id: status_label
            text_font: roboto24
            text: "Disconnected"
            width: 480
            y: 320
            x: 0
            text_align: center
            text_color: 0xFFFFFF
            text_opa: 100%
        - label:
            width: 480
            height: 10
            text: " "
        - obj:
            align: CENTER
            width: 480
            height: 40
            pad_all: 3
            y: 320
            bg_opa: TRANSP
            scrollable: false
            border_opa: TRANSP
            layout: # enable the FLEX layout for the children widgets
              type: FLEX
              flex_flow: ROW # the order of the widgets starts top left
              flex_align_cross: CENTER # they sould be centered
            widgets:
              - label:
                  id: peak_spl_label
                  text: "---.- dBA Peak"
                  text_align: left
                  text_font: roboto24
                  text_color: 0xFFFFFF
                  width: 240
                  height: 24
                  pad_left: 30
              - label:
                  id: current_spl_label
                  text: "---.- dBA"
                  text_align: right
                  text_font: roboto24
                  text_color: 0xFFFFFF
                  width: 240
                  height: 24
                  pad_right: 50
    - id: message_page
      skip: true
      width: 480
      height: 480
      bg_color: 0x101827
      pad_all: 12
      pad_top: 70
      pad_row: 6
      layout:
        type: flex
        flex_flow: COLUMN
        flex_align_cross: CENTER
      widgets:
        - button:
            width: 440
            height: 48
            bg_color: 0x334155
            on_click:
              - lvgl.page.show: main_page
            widgets:
              - label:
                  text: "Close"
                  align: CENTER
                  text_font: roboto24
                  text_color: 0xFFFFFF
        - button:
            width: 440
            height: 48
            bg_color: 0x203050
            on_click:
              - if:
                  condition:
                    lambda: return !id(dj_message_1).empty();
                  then:
                    - mqtt.publish:
                        topic: !lambda return id(dj_message_topic);
                        payload: !lambda return id(dj_message_1);
                    - lvgl.page.show: main_page
            widgets:
              - label:
                  id: message_label_1
                  text: "Audio problem"
                  align: CENTER
                  text_font: roboto24
                  text_color: 0xFFFFFF
        - button:
            width: 440
            height: 48
            bg_color: 0x203050
            on_click:
              - if:
                  condition:
                    lambda: return !id(dj_message_2).empty();
                  then:
                    - mqtt.publish:
                        topic: !lambda return id(dj_message_topic);
                        payload: !lambda return id(dj_message_2);
                    - lvgl.page.show: main_page
            widgets:
              - label:
                  id: message_label_2
                  text: "Light problem"
                  align: CENTER
                  text_font: roboto24
                  text_color: 0xFFFFFF
        - button:
            width: 440
            height: 48
            bg_color: 0x203050
            on_click:
              - if:
                  condition:
                    lambda: return !id(dj_message_3).empty();
                  then:
                    - mqtt.publish:
                        topic: !lambda return id(dj_message_topic);
                        payload: !lambda return id(dj_message_3);
                    - lvgl.page.show: main_page
            widgets:
              - label:
                  id: message_label_3
                  text: "Yes"
                  align: CENTER
                  text_font: roboto24
                  text_color: 0xFFFFFF
        - button:
            width: 440
            height: 48
            bg_color: 0x203050
            on_click:
              - if:
                  condition:
                    lambda: return !id(dj_message_4).empty();
                  then:
                    - mqtt.publish:
                        topic: !lambda return id(dj_message_topic);
                        payload: !lambda return id(dj_message_4);
                    - lvgl.page.show: main_page
            widgets:
              - label:
                  id: message_label_4
                  text: "No"
                  align: CENTER
                  text_font: roboto24
                  text_color: 0xFFFFFF
        - button:
            width: 440
            height: 48
            bg_color: 0x203050
            on_click:
              - if:
                  condition:
                    lambda: return !id(dj_message_5).empty();
                  then:
                    - mqtt.publish:
                        topic: !lambda return id(dj_message_topic);
                        payload: !lambda return id(dj_message_5);
                    - lvgl.page.show: main_page
            widgets:
              - label:
                  id: message_label_5
                  text: "—"
                  align: CENTER
                  text_font: roboto24
                  text_color: 0xFFFFFF
        - button:
            width: 440
            height: 48
            bg_color: 0x203050
            on_click:
              - if:
                  condition:
                    lambda: return !id(dj_message_6).empty();
                  then:
                    - mqtt.publish:
                        topic: !lambda return id(dj_message_topic);
                        payload: !lambda return id(dj_message_6);
                    - lvgl.page.show: main_page
            widgets:
              - label:
                  id: message_label_6
                  text: "—"
                  align: CENTER
                  text_font: roboto24
                  text_color: 0xFFFFFF
    - id: incoming_message_page
      skip: true
      width: 480
      height: 480
      bg_color: 0x101827
      pad_all: 20
      pad_top: 70
      pad_row: 10
      scrollable: false
      layout:
        type: flex
        flex_flow: COLUMN
        flex_align_cross: CENTER
      widgets:
        - label:
            text: "Incoming message"
            width: 430
            height: 35
            text_align: CENTER
            text_font: roboto24
            text_color: 0xFFFFFF
        - label:
            id: incoming_message_label
            text: ""
            width: 430
            height: 190
            long_mode: SCROLL
            text_align: CENTER
            text_font: roboto24
            text_color: 0xFFFFFF
        - obj:
            width: 440
            height: 60
            pad_all: 0
            pad_column: 8
            bg_opa: TRANSP
            border_opa: TRANSP
            scrollable: false
            layout:
              type: flex
              flex_flow: ROW
            widgets:
              - button:
                  width: 138
                  height: 60
                  bg_color: 0x203050
                  on_click:
                    - mqtt.publish:
                        topic: !lambda return id(dj_message_topic);
                        payload: "No"
                    - script.execute: dismiss_message
                  widgets:
                    - label:
                        text: "No"
                        align: CENTER
                        text_font: roboto24
                        text_color: 0xFFFFFF
              - button:
                  width: 138
                  height: 60
                  bg_color: 0x203050
                  on_click:
                    - mqtt.publish:
                        topic: !lambda return id(dj_message_topic);
                        payload: "OK"
                    - script.execute: dismiss_message
                  widgets:
                    - label:
                        text: "OK"
                        align: CENTER
                        text_font: roboto24
                        text_color: 0xFFFFFF
              - button:
                  width: 138
                  height: 60
                  bg_color: 0x203050
                  on_click:
                    - mqtt.publish:
                        topic: !lambda return id(dj_message_topic);
                        payload: "Yes"
                    - script.execute: dismiss_message
                  widgets:
                    - label:
                        text: "Yes"
                        align: CENTER
                        text_font: roboto24
                        text_color: 0xFFFFFF
        - button:
            width: 440
            height: 60
            bg_color: 0x334155
            on_click:
              - script.execute: dismiss_message
            widgets:
              - label:
                  text: "Close"
                  align: CENTER
                  text_font: roboto24
                  text_color: 0xFFFFFF
  on_boot:
    then:
      - lvgl.update:
          disp_bg_color: 0x111111

